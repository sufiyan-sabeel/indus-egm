[package]
name = "indus-egm"
version = "0.2.0"
edition = "2021"
rust-version = "1.74"
description = "Install agent bundles (Elephant-Goldfish Model, REA) into a coding agent from one Rust binary"
license = "Apache-2.0"
repository = "https://github.com/sufiyan-sabeel/indus-egm"
homepage = "https://github.com/sufiyan-sabeel/indus-egm"
readme = "README.md"
keywords = ["egm", "rea", "skills", "agents", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "indus_egm"
path = "src/lib.rs"

[[bin]]
name = "indus-egm"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
